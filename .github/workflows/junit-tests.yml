name: CI - JUnit Java

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run JUnit tests
    runs-on: ubuntu-latest
    steps:
      - name: Obtain source code
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Run tests with Gradle
        run: ./gradlew test --no-daemon
